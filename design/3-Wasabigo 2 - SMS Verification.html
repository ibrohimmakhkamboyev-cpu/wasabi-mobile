<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMS Verification - Wasabigo 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#678F07',
              secondary: '#E98F01',
              dark: '#141414',
              muted: '#767676',
              bg: '#FFFADD',
              stroke: '#EDE6BF'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&amp;display=swap"
      rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #FFFADD;
        color: #141414;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      .otp-input {
        width: 100%;
        height: 64px;
        text-align: center;
        font-size: 24px;
        font-weight: 800;
        border-radius: 16px;
        background: white;
        border: 1.5px solid #E1E5DB;
        color: #141414;
        transition: all .2s ease;
      }

      .otp-input:focus {
        outline: none;
        border-color: #678F07;
        box-shadow: 0 0 0 4px rgba(103, 143, 7, .12);
      }
    </style>
  </head>

  <body class="min-h-screen bg-bg antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-5 pb-7 pt-3">
      <button
        class="flex h-12 w-12 items-center justify-center rounded-full text-primary transition active:scale-95">
        <i class="fa-solid fa-chevron-left text-2xl"></i>
      </button>

      <section class="mt-6 flex flex-col items-center text-center">
        <div class="relative h-[190px] w-full">
          <div
            class="absolute left-1/2 top-4 h-40 w-40 -translate-x-1/2 rounded-full bg-primary/10">
          </div>
          <div class="absolute left-[19%] top-10 h-5 w-5 rounded-full bg-primary/15">
          </div>
          <div class="absolute right-[18%] top-[104px] h-5 w-5 rounded-full bg-primary/15">
          </div>
          <div class="absolute left-[12%] top-[132px] h-6 w-6 rounded-full bg-primary/15">
          </div>
          <div
            class="absolute left-1/2 top-[58px] flex h-[72px] w-[92px] -translate-x-1/2 items-center justify-center rounded-[20px] bg-primary shadow-2xl shadow-primary/20">
            <i class="fa-solid fa-ellipsis text-4xl text-white"></i>
          </div>
          <div
            class="absolute left-1/2 top-[106px] flex h-[82px] w-[122px] -translate-x-1/2 items-center justify-center rounded-[14px] border-[3px] border-white bg-[#EAF2D6] shadow-2xl shadow-primary/20">
            <i class="fa-regular fa-envelope text-5xl text-primary"></i>
          </div>
        </div>

        <h1 class="mt-8 text-[34px] font-black leading-tight tracking-normal text-dark">
          SMS-код отправлен
        </h1>
        <p class="mt-4 max-w-[310px] text-[17px] font-medium leading-relaxed text-muted">
          Мы отправили 6-значный код подтверждения на ваш номер
        </p>
        <div class="mt-4 flex items-center justify-center gap-2 text-primary">
          <span class="text-[22px] font-black tracking-wide">+998 90 123 45 67</span>
          <button class="flex h-10 w-10 items-center justify-center rounded-full">
            <i class="fa-regular fa-pen-to-square text-2xl"></i>
          </button>
        </div>
      </section>

      <section class="mt-8">
        <div class="grid grid-cols-6 gap-[9px]">
          <input type="tel" maxlength="1" autofocus class="otp-input">
          <input type="tel" maxlength="1" class="otp-input">
          <input type="tel" maxlength="1" class="otp-input">
          <input type="tel" maxlength="1" class="otp-input">
          <input type="tel" maxlength="1" class="otp-input">
          <input type="tel" maxlength="1" class="otp-input">
        </div>
        <p id="timer-text" class="mt-7 text-center text-[15px] font-medium text-dark">
          Не получили код?
          <span id="timer" class="ml-2 font-extrabold text-primary">00:45</span>
        </p>
        <button id="resend-btn"
          class="mx-auto mt-5 hidden text-sm font-black text-primary">
          Отправить код повторно
        </button>
      </section>

      <button
        class="mt-9 h-16 rounded-[18px] bg-primary text-xl font-black text-white shadow-lg shadow-primary/25 transition active:scale-[.98]">
        Подтвердить
      </button>

      <section
        class="mt-7 flex items-center gap-5 rounded-[22px] border border-stroke bg-white/75 p-5">
        <div
          class="flex h-[62px] w-[62px] shrink-0 items-center justify-center rounded-full bg-primary/10">
          <i class="fa-solid fa-shield-halved text-3xl text-primary"></i>
        </div>
        <div class="text-left">
          <h2 class="text-lg font-black text-dark">Безопасная проверка</h2>
          <p class="mt-2 text-[15px] font-medium leading-snug text-muted">
            Мы никому не передаем ваш номер телефона.
          </p>
        </div>
      </section>
    </main>

    <script>
      const inputs = [...document.querySelectorAll('.otp-input')];
      inputs.forEach((input, index) => {
        input.addEventListener('input', event => {
          event.target.value = event.target.value.replace(/\D/g, '').slice(0, 1);
          if (event.target.value && index < inputs.length - 1) inputs[index + 1].focus();
        });
        input.addEventListener('keydown', event => {
          if (event.key === 'Backspace' && !event.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });

      const timer = document.getElementById('timer');
      const timerText = document.getElementById('timer-text');
      const resendBtn = document.getElementById('resend-btn');
      let remaining = 45;
      let countdown;

      function startTimer() {
        clearInterval(countdown);
        remaining = 45;
        timerText.classList.remove('hidden');
        resendBtn.classList.add('hidden');
        timer.textContent = '00:45';
        countdown = setInterval(() => {
          remaining -= 1;
          timer.textContent = `00:${String(remaining).padStart(2, '0')}`;
          if (remaining <= 0) {
            clearInterval(countdown);
            timerText.classList.add('hidden');
            resendBtn.classList.remove('hidden');
          }
        }, 1000);
      }

      resendBtn.addEventListener('click', startTimer);
      startTimer();
    </script>
  </body>
</html>
